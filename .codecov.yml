# Coverage arrives in exactly two uploads: `unit` (jsdom lane) and `webgl`
# (Chromium-WebGL2 lane), both from a push to a long-lived branch. Both lanes
# are enabled by the same `engine` area, so they either both upload or neither
# does — there is no case where one upload arrives alone and the second never
# comes.
#
# Without this, Codecov judges the first upload it receives and posts a verdict
# on jsdom-only coverage: every line the browser lane covers counts as a miss,
# so `codecov/patch` goes red for several minutes and only flips to green once
# the second upload lands. The verdict was always correct in the end — the red
# was purely an artefact of judging half the data.
codecov:
  notify:
    after_n_builds: 2
    # Don't judge before the CI run itself has finished reporting.
    wait_for_ci: true

coverage:
  # Minimum project-wide coverage before Codecov reports a failure.
  # Start permissive; tighten once coverage grows above these floors.
  # These statuses are informational — the hard regression gate is the
  # vitest coverage thresholds in vitest.config.ts (fails the CI job itself).
  status:
    project:
      default:
        target: 50%
        threshold: 2% # allow up to 2 pp drop before failing
    patch:
      default:
        target: 60% # new code in a PR should be ≥ 60% covered

  # Files / paths excluded from coverage accounting.
ignore:
  - 'src/**/*.d.ts'
  - 'src/**/index.ts' # barrel re-exports add noise, not signal
  - 'packages/*/src/**/*.d.ts'
  - 'packages/*/src/**/index.ts'
  - 'scripts/**'
  - 'test/**'
  - 'packages/*/test/**'
  - 'site/**'

comment:
  layout: 'reach,diff,flags,components,files,bundle_analysis'
  behavior: default
  require_changes: true # only comment when coverage actually changes
  after_n_builds: 2 # same reason as `codecov.notify` — never comment on half the data

# Bundle analysis. `scripts/build.ts` uploads per-bundle module stats for every
# artefact it builds when CODECOV_TOKEN is present, which is what lets Codecov
# report a base-vs-PR size delta in the PR comment above.
#
# Informational on purpose: the hard budget is the `pnpm size` gate in the
# Package Build + Verify job, whose limits live in package.json#size-limit and
# whose absolute numbers the same job writes to the run summary. A percentage
# threshold here would be a second, differently-shaped budget nobody set.
bundle_analysis:
  status: informational
  warning_threshold: '5%'

# Upload flags — one per test lane that uploads coverage (see scripts/ci/lanes.ts).
flags:
  unit:
    paths:
      - src/
      - packages/
    carryforward: true
  # Istanbul coverage collected by the Chromium-WebGL2 browser lane — the
  # only lane that executes the real GPU backend paths (src/rendering/webgl2,
  # webgpu bootstrap, browser-only branches). Merged with `unit` into the
  # overall number; carryforward keeps it for commits whose CI run skips the
  # browser lane.
  webgl:
    paths:
      - src/
      - packages/
    carryforward: true

# Per-package coverage breakdown in the PR comment and dashboard.
# Components are pure reporting slices over the merged uploads (`unit` +
# `webgl`) — no extra uploads needed.
component_management:
  default_rules:
    statuses: [] # informational only — no per-component commit statuses
  individual_components:
    - component_id: core
      name: core
      paths:
        - src/**
    - component_id: particles
      name: particles
      paths:
        - packages/exojs-particles/src/**
    - component_id: tilemap
      name: tilemap
      paths:
        - packages/exojs-tilemap/src/**
    - component_id: tiled
      name: tiled
      paths:
        - packages/exojs-tiled/src/**
    - component_id: physics
      name: physics
      paths:
        - packages/exojs-physics/src/**
    - component_id: tilemap-physics
      name: tilemap-physics
      paths:
        - packages/exojs-tilemap-physics/src/**
    - component_id: audio-fx
      name: audio-fx
      paths:
        - packages/exojs-audio-fx/src/**
