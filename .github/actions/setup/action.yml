name: Set up the workspace
description: pnpm, Node, dependencies, and optionally a Playwright browser, the Naga validator and the built dist.

inputs:
  browser:
    description: Playwright browser to install (chromium or firefox); empty installs none
    default: ''
  apt:
    description: Space-separated apt packages to install; empty installs none
    default: ''
  naga:
    description: Install the Naga WGSL validator (pinned by NAGA_VERSION in the workflow env)
    default: 'false'
  dist:
    description: Download the dist artifact the build job uploaded
    default: 'false'

runs:
  using: composite
  steps:
    # Git records the executable bit, and a Linux checkout materialises it as
    # 755 while the file is committed 644. The release preparation reads the
    # working tree and would see that mode flip as an uncommitted change, so the
    # mode is compared out of Git here - the same reason contributors on Windows
    # and macOS already run with core.fileMode set locally.
    - name: Ignore executable-bit differences
      run: git config --global core.fileMode false
      shell: bash

    # The pnpm version comes from `packageManager` in package.json.
    - uses: pnpm/action-setup@v6
      with:
        run_install: false

    # The Node version comes from `.nvmrc`, the same file `devEngines` in
    # package.json enforces locally, so CI and a contributor's shell agree.
    - uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc
        check-latest: true
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    - shell: bash
      run: pnpm bootstrap

    - if: inputs.apt != ''
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y ${{ inputs.apt }}

    - if: inputs.browser != ''
      uses: actions/cache@v5
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-playwright-

    - if: inputs.browser != ''
      shell: bash
      run: pnpm exec playwright install --with-deps ${{ inputs.browser }}

    - if: inputs.naga == 'true'
      id: naga-cache
      uses: actions/cache@v5
      with:
        path: ~/.cargo/bin/naga
        key: naga-cli-${{ env.NAGA_VERSION }}-${{ runner.os }}

    - if: inputs.naga == 'true' && steps.naga-cache.outputs.cache-hit != 'true'
      shell: bash
      run: cargo install naga-cli --version "$NAGA_VERSION" --locked

    - if: inputs.dist == 'true'
      uses: actions/download-artifact@v4
      with:
        name: dist
