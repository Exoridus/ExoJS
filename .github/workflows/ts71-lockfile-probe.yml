name: Temporary TypeScript 7.1 lockfile generation

on:
  push:
    branches:
      - chore/ts71-oxlint-final-migration
    paths:
      - packages/exojs-config/package.json
      - .github/workflows/ts71-lockfile-probe.yml

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Recalculate lockfile without executing dependencies
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Return exact generated lockfile
        shell: bash
        run: |
          printf '%s\n' '__TS71_LOCKFILE_BEGIN__'
          cat pnpm-lock.yaml
          printf '%s\n' '__TS71_LOCKFILE_END__'
