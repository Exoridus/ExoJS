name: Playground key delivery diagnostic

on:
  push:
    branches: [test/playground-linux-key-delivery]

permissions:
  actions: read
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          browser: chromium
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: 45215140919
          name: site-next-85db7814b63f7de9e9611ef8ff6758d6e8c7566c-1
          path: site/dist
      - name: Prove replay on a trusted keydown
        run: |
          node scripts/ci/diagnose-playground-key-delivery.ts
          if pnpm test:playground:e2e --suite lifecycle --only 'boss-intro-cinematic at 320px' 2>&1 | tee "$RUNNER_TEMP/replay-red.log"; then
            echo 'The original example unexpectedly replayed before keyup' >&2
            exit 1
          fi
          grep -F 'Timed out waiting for keyboard replay on keydown' "$RUNNER_TEMP/replay-red.log"
          grep -F '"scope":"engine","event":"keydown","channel":82' "$RUNNER_TEMP/replay-red.log"

          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const file = 'site/dist/examples/showcase/boss-intro-cinematic.js';
          const source = readFileSync(file, 'utf8');
          const release = 'this.inputs.onTrigger(Keyboard.R, () => this.replay());';
          if (source.split(release).length !== 2) throw new Error('Expected exactly one replay binding');
          writeFileSync(file, source.replace(release, 'this.inputs.onStart(Keyboard.R, () => this.replay());'));
          JS
          pnpm test:playground:e2e --suite lifecycle --only 'boss-intro-cinematic at'
