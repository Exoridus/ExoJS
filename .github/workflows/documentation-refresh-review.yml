name: Documentation refresh review (temporary)

on:
  push:
    branches: [docs/documentation-refresh-d0538029]
    paths:
      - _migration/validation-request.json
      - .github/workflows/documentation-refresh-review.yml

permissions:
  contents: write

concurrency:
  group: documentation-refresh-review
  cancel-in-progress: true

jobs:
  review:
    if: github.ref == 'refs/heads/docs/documentation-refresh-d0538029'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Reproduce entry-point regressions and check their replacement
        run: |
          python3 _migration/polish-check.py --baseline
          python3 _migration/polish-check.py
      - name: Materialize reviewed documentation
        run: |
          python3 _migration/finish-surfaces.py
          pnpm exec tsx _migration/audit-jsdoc.ts
          python3 _migration/polish-surfaces.py
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          source = json.loads(Path('_migration/source.json').read_text())['sourceCommit']
          paths = subprocess.check_output(['git', 'diff', '--name-only', source], text=True).splitlines()
          paths += subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines()
          # Root Prettier has no Astro parser. Astro files are parsed by astro check and the site build.
          files = sorted({p for p in paths if Path(p).is_file() and not p.startswith('_migration/') and Path(p).suffix in {'.md', '.mdx', '.ts', '.tsx', '.json'}})
          if files:
              subprocess.run(['pnpm', 'exec', 'prettier', '--write', *files], check=True)
          educational = [p for p in files if p.startswith('examples/guides/') and p.endswith('.ts')]
          if educational:
              subprocess.run(['pnpm', 'exec', 'eslint', '--fix', '--max-warnings=0', *educational], check=True)
          PY
      - name: Generate API documentation from source
        run: pnpm docs:api:generate
      - name: Commit materialized documentation and rebase onto next
        run: |
          test "$GITHUB_REF" = refs/heads/docs/documentation-refresh-d0538029
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md site/src site/README.md site/package.json packages/*/README.md examples/guides packages/exojs-lighting/src/Lighting.ts packages/exojs-particles/src/ParticleSystem.ts src/assets/LoaderScope.ts src/debug/RenderPassInspectorLayer.ts
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'docs: polish entry points and materialize guide navigation'
          fi
          git fetch origin next
          git rebase origin/next
          git push origin HEAD:refs/heads/docs/documentation-refresh-d0538029
      - name: Check documentation integration
        id: checks
        continue-on-error: true
        run: python3 _migration/run-checks.py
      - name: Build the complete site
        id: build
        continue-on-error: true
        run: pnpm site:build
      - name: Record lane selection
        if: always()
        run: pnpm lanes --base origin/next > _migration/selected-lanes.txt
      - name: Preserve observed results
        if: always()
        env:
          CHECKS_RESULT: ${{ steps.checks.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          report = {'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'next': subprocess.check_output(['git', 'rev-parse', 'origin/next'], text=True).strip(), 'runId': os.environ['GITHUB_RUN_ID'], 'checks': os.environ['CHECKS_RESULT'], 'siteBuild': os.environ['BUILD_RESULT']}
          Path('_migration/polish-validation.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _migration/polish-validation.json
          for file in _migration/validation.json _migration/readme-examples.json _migration/selected-lanes.txt; do
            if test -f "$file"; then git add "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record documentation integration evidence'
            git push origin HEAD:refs/heads/docs/documentation-refresh-d0538029
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: documentation-polish-evidence
          path: |
            _migration/polish-validation.json
            _migration/validation.json
            _migration/readme-examples.json
            _migration/selected-lanes.txt
            _migration/check-logs/
            .workspace/logs/
          include-hidden-files: true
      - name: Require successful integration
        if: always()
        run: test '${{ steps.checks.outcome }}' = success && test '${{ steps.build.outcome }}' = success
