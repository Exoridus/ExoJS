name: Documentation refresh review (temporary)

on:
  push:
    branches: [docs/documentation-refresh-d0538029]
    paths:
      - _migration/validation-request.json
      - .github/workflows/documentation-refresh-review.yml

permissions:
  contents: write

concurrency:
  group: documentation-refresh-review
  cancel-in-progress: true

jobs:
  review:
    if: github.ref == 'refs/heads/docs/documentation-refresh-d0538029'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Apply observed documentation corrections
        run: |
          python3 _migration/repair-polish.py
          python3 _migration/polish-check.py
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          paths = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          files = [p for p in paths if Path(p).is_file() and not p.startswith('_migration/') and Path(p).suffix in {'.md', '.mdx', '.ts', '.tsx', '.json'}]
          if files:
              subprocess.run(['pnpm', 'exec', 'prettier', '--write', *files], check=True)
          PY
      - name: Commit corrected documentation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- packages/exojs-ldtk/README.md packages/exojs-pathfinding/README.md site/src/content/guide _migration/check-readme-examples.py
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'docs: correct package examples and contextual guide navigation'
            git push origin HEAD:refs/heads/docs/documentation-refresh-d0538029
          fi
      - name: Build the dependencies consumed by the site
        run: pnpm build:all
      - name: Check documentation integration
        id: checks
        continue-on-error: true
        run: python3 _migration/run-checks.py
      - name: Build the complete site
        id: build
        continue-on-error: true
        run: pnpm site:build > _migration/site-build.log 2>&1 || { tail -n 100 _migration/site-build.log; exit 1; }
      - name: Check generated links and fragments
        if: steps.build.outcome == 'success'
        id: links
        continue-on-error: true
        run: python3 _migration/check-built-links.py
      - name: Record lane selection
        if: always()
        run: pnpm lanes --base origin/next > _migration/selected-lanes.txt
      - name: Preserve actual outcomes
        if: always()
        env:
          CHECKS_RESULT: ${{ steps.checks.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          LINKS_RESULT: ${{ steps.links.outcome }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          report = {'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'next': subprocess.check_output(['git', 'rev-parse', 'origin/next'], text=True).strip(), 'runId': os.environ['GITHUB_RUN_ID'], 'checks': os.environ['CHECKS_RESULT'], 'siteBuild': os.environ['BUILD_RESULT'], 'builtLinks': os.environ['LINKS_RESULT']}
          Path('_migration/polish-validation.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _migration/polish-validation.json
          for file in _migration/validation.json _migration/readme-examples.json _migration/selected-lanes.txt _migration/built-links.json; do
            if test -f "$file"; then git add "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record built documentation checks'
            git push origin HEAD:refs/heads/docs/documentation-refresh-d0538029
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: documentation-polish-evidence
          path: |
            _migration/polish-validation.json
            _migration/validation.json
            _migration/readme-examples.json
            _migration/built-links.json
            _migration/selected-lanes.txt
            _migration/check-logs/
            _migration/site-build.log
          include-hidden-files: true
      - name: Require successful integration
        if: always()
        run: test '${{ steps.checks.outcome }}' = success && test '${{ steps.build.outcome }}' = success && test '${{ steps.links.outcome }}' = success
