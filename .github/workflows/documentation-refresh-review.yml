name: Documentation refresh review (temporary)

on:
  push:
    branches: [docs/documentation-refresh-d0538029]
    paths:
      - _migration/validation-request.json
      - .github/workflows/documentation-refresh-review.yml

permissions:
  contents: write

concurrency:
  group: documentation-refresh-review
  cancel-in-progress: true

jobs:
  review:
    if: github.ref == 'refs/heads/docs/documentation-refresh-d0538029'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Materialize reviewed site and JSDoc edits
        run: |
          python3 _migration/finish-surfaces.py
          pnpm exec tsx _migration/audit-jsdoc.ts
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          source = json.loads(Path('_migration/source.json').read_text())['sourceCommit']
          changed = subprocess.check_output(['git', 'diff', '--name-only', source], text=True).splitlines()
          fresh = subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines()
          files = sorted({p for p in changed + fresh if Path(p).is_file() and not p.startswith('_migration/') and Path(p).suffix in {'.md', '.mdx', '.ts', '.tsx', '.astro', '.json'}})
          if files:
              subprocess.run(['pnpm', 'exec', 'prettier', '--write', *files], check=True)
          PY
      - name: Generate the API from source JSDoc
        run: pnpm docs:api:generate
      - name: Commit complete materialized files on the isolated branch
        run: |
          test "$GITHUB_REF" = refs/heads/docs/documentation-refresh-d0538029
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md CONTRIBUTING.md AGENTS.md site/src site/package.json packages/*/README.md packages/exojs-lighting/src/Lighting.ts packages/exojs-particles/src/ParticleSystem.ts src/assets/LoaderScope.ts src/debug/RenderPassInspectorLayer.ts _migration/site-materialization.json _migration/api-source-inventory.json _migration/jsdoc-files.json
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'docs: align site entry points and generate corrected API contracts'
            git push origin HEAD:refs/heads/docs/documentation-refresh-d0538029
          fi
      - name: Check the materialized documentation
        id: checks
        continue-on-error: true
        run: python3 _migration/run-checks.py
      - name: Record observed validation
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if test -f _migration/validation.json; then
            git add _migration/validation.json _migration/readme-examples.json
            if ! git diff --cached --quiet; then
              git commit -m 'chore: record site and API documentation checks'
              git push origin HEAD:refs/heads/docs/documentation-refresh-d0538029
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: documentation-integration-evidence
          path: |
            _migration/validation.json
            _migration/readme-examples.json
            _migration/check-logs/
      - name: Require successful checks
        if: always()
        run: test '${{ steps.checks.outcome }}' = success
