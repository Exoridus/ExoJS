name: input-format-diagnostic
on:
  pull_request:
    branches: [next]
  push:
    branches:
      - fix/input-pointer-primary-events
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm bootstrap
      - name: Show Prettier diff
        run: |
          pnpm exec prettier --write test/input/interaction-integration.test.ts
          git diff -- test/input/interaction-integration.test.ts
      - name: Show API docs diff
        run: |
          pnpm docs:api:generate
          git diff -- site/src/content/api/interaction-event.json
