name: CI Checks

# Reusable workflow with parallel quality gates (typecheck, lint, unit tests,
# browser tests), plus package verification and a final site build gate.
#
# Called by ci.yml and release.yml so both use exactly the same gate.

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version passed to setup-node'
        type: string
        default: '24.x'
      ref:
        description: 'Git ref to check out (empty = triggering commit)'
        type: string
        default: ''
      pnpm-version:
        description: 'pnpm version spec (e.g. 11.4.0, 11, latest)'
        type: string
        default: '11.4.0'

permissions:
  contents: read
  # Codecov action posts a coverage comment on PRs.
  pull-requests: write

env:
  CI: true
  # Pinned so the WGSL gate is reproducible and its cache key is exact. Bumping
  # it is a deliberate change: a newer Naga accepts more of the language, which
  # moves what this gate rejects.
  NAGA_VERSION: 26.0.0

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      engine: ${{ steps.decide.outputs.engine }}
      site: ${{ steps.decide.outputs.site }}
      audioFx: ${{ steps.decide.outputs.audioFx }}
      tilemapWorker: ${{ steps.decide.outputs.tilemapWorker }}
      exampleCatalog: ${{ steps.decide.outputs.exampleCatalog }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      # On pull requests, list every changed file (dorny/paths-filter resolves
      # the base / merge-base robustly) and hand the list to
      # scripts/ci/select-lanes.ts, which decides the effective lanes. Pushes to
      # main, tag releases (via release.yml) and manual dispatches skip this step;
      # select-lanes then runs every lane, so a release is never partially
      # checked.
      #
      # The path-to-lane mapping lives in scripts/ci/select-lanes.ts — NOT in
      # this YAML — so it is a single source of truth that
      # test/ci/select-lanes.test.ts can assert deterministically.
      - name: List changed files
        id: changed
        if: ${{ github.event_name == 'pull_request' }}
        uses: dorny/paths-filter@v3
        with:
          list-files: json
          filters: |
            all:
              - '**'

      # select-lanes.ts is TypeScript that node type-strips on its own, so this
      # job needs a node that does that unflagged (>= 22.18) — pinned here to the
      # same version every other job uses rather than inherited from whatever the
      # runner image happens to ship. Node only, no cache and no install: the
      # detector stays dependency-free and always-on.
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}

      - name: Decide effective lanes
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGED_FILES: ${{ steps.changed.outputs.all_files }}
        run: node scripts/ci/select-lanes.ts >> "$GITHUB_OUTPUT"

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ inputs.pnpm-version }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          check-latest: true
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm bootstrap

      # The gate list lives in scripts/ci/gates.ts, which the local verify:quick
      # pre-push hook runs in full. Spelling the commands out here again is what
      # let this job drift below the hook: it claimed parity in a comment while
      # omitting typecheck:site and typecheck:test. Add a gate there, not here.
      #
      # This group covers src/** plus the sets root `pnpm typecheck` does not
      # reach: guides, examples (strict config), the standalone type-tests
      # project, the extension packages (own tsconfig each), and the test
      # sources. typecheck:site is deliberately NOT here — it needs the built
      # dist, so it runs as the `site` group in the site-build job.
      - name: Typecheck gates
        run: pnpm gates typecheck

  # Validates the published-manifest shape (exports map, files allowlist,
  # peer/dev-dependency split, no `workspace:` leaks, ...) of every official
  # runtime package via `@codexo/exojs-config/package-policy`. Pure Node, no
  # third-party deps and no build required, so it stays ungated (like
  # typecheck/lint) instead of waiting on the `build` job's dist artifact.
  package-policy:
    name: Package Policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ inputs.pnpm-version }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          check-latest: true
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm bootstrap

      - name: Verify package policy
        run: pnpm verify:package-policy

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ inputs.pnpm-version }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          check-latest: true
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm bootstrap

      # lint:all + format:check, from the shared list in scripts/ci/gates.ts.
      #
      # Prettier is enforced by the pre-push hook (verify:release), but hooks can
      # be bypassed (--no-verify) and merged PRs were never format-gated, so
      # formatting drifted across the v0.13 PRs and blocked the v0.13.0 tag push.
      # This is the CI backstop. Auto-fixable: a failure means `pnpm format`.
      - name: Lint gates
        run: pnpm gates lint

  # Generated-artifact sync gates: the committed API docs and the committed
  # example .js files must match a fresh generation from source. Both regenerate
  # from src/ and examples/ without needing the built dist, so this stays ungated
  # (like typecheck/lint/package-policy) instead of waiting on the `build` job —
  # `docs:api:check` previously sat in `package-verify` behind that wait.
  sync-checks:
    name: Sync Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ inputs.pnpm-version }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          check-latest: true
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm bootstrap

      # Both are dry-run checks that leave the working tree unchanged.
      - name: Sync gates
        run: pnpm gates sync

  unit-tests:
    name: Unit Tests (Coverage)
    needs: [changes]
    if: ${{ needs.changes.outputs.engine == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ inputs.pnpm-version }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          check-latest: true
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm bootstrap

      # Naga is the WGSL front end of wgpu, and therefore of Firefox's WebGPU.
      # `test/rendering/wgsl-naga-validation.test.ts` is the only gate in CI
      # that sees WGSL through anything but Tint: the Firefox WebGPU lane gets
      # no adapter here and runs non-blocking. Restored from cache on almost
      # every run — the key pins the exact version, so a hit is a hit.
      - name: Cache the Naga validator
        id: naga-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/naga
          key: naga-cli-${{ env.NAGA_VERSION }}-${{ runner.os }}

      - name: Install the Naga validator
        if: steps.naga-cache.outputs.cache-hit != 'true'
        run: cargo install naga-cli --version "$NAGA_VERSION" --locked

      # NOTE: no `--` before the extra args — pnpm (unlike npm) forwards a
      # literal `--` to the script, and vitest silently discards everything
      # after it (the junit reporter args here were dropped that way for
      # months; the analytics upload below only warned, never failed).
      - name: Test (with coverage)
        # EXOJS_REQUIRE_NAGA turns a missing binary from a skip into a failure:
        # locally the validator is optional, in CI its absence is a broken lane.
        env:
          EXOJS_REQUIRE_NAGA: '1'
        run: pnpm test:coverage --reporter=default --reporter=junit --outputFile.junit=./test-results/unit.junit.xml

      # Deliberately OUTSIDE the coverage run. Istanbul rewrites every statement
      # and V8 then stops scalar-replacing what it otherwise would, so the
      # allocation gate measures the instrumentation instead of the engine —
      # `mesh/1000` reads 71 KB/frame instrumented against 0.65 KB/frame plain.
      # No junit reporter here: the `skip-budget` job below reads the file the
      # coverage run wrote, and a second writer would replace it.
      - name: Allocation gate (no coverage instrumentation)
        run: pnpm test:alloc

      # A skipped test is neither a pass nor a failure, so it vanishes from the
      # summary. The budget check itself runs once, in the `skip-budget` job,
      # against every lane's JUnit report combined — not here per-lane — because
      # a `ctx.skip()` inside a browser/WebGPU spec never shows up in THIS job's
      # report at all. This step just hands that job the unit lane's half.
      - name: Upload JUnit report for the skip-budget gate
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-unit
          path: ./test-results/unit.junit.xml
          retention-days: 1
          if-no-files-found: warn

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6.0.2
        with:
          files: ./coverage/lcov.info
          flags: unit
          # Loud on purpose when a token is present (the upload failed silently
          # for months and nobody noticed), but non-fatal when it is absent:
          # Dependabot / fork PRs run without repository secrets, so a strict
          # upload would fail Required CI on a green test run (only the codecov
          # step fails: "Token required because branch is protected").
          fail_ci_if_error: ${{ secrets.CODECOV_TOKEN != '' }}
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: Exoridus/ExoJS

      # Test Analytics (flaky detection, failure rates, slowest tests). Runs
      # even when the test step failed — capturing failures is the point.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          files: ./test-results/unit.junit.xml
          flags: unit
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  browser-tests:
    name: Browser Tests
    needs: [changes]
    if: ${{ needs.changes.outputs.engine == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ inputs.pnpm-version }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          check-latest: true
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm bootstrap

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # Istanbul instrumentation is enabled so the real GPU-backend lines this
      # lane executes count toward the Codecov number (the jsdom `unit` flag
      # can never reach them). The global vitest coverage thresholds are the
      # jsdom ratchet — zero them here, this lane only *collects* coverage.
      # No `--` before the args (see the unit-tests step note).
      - name: Browser tests (Chromium WebGL2, new headless)
        run: >-
          pnpm test:browser:webgl
          --reporter=default --reporter=junit --outputFile.junit=./test-results/browser-webgl.junit.xml
          --coverage --coverage.reporter=lcov --coverage.reporter=text-summary
          --coverage.thresholds.statements=0 --coverage.thresholds.branches=0
          --coverage.thresholds.functions=0 --coverage.thresholds.lines=0

      # The inline-source lane rides along here rather than owning a job: it
      # needs the same headless Chromium and finishes in seconds, and its
      # subject (`@codexo/exojs-build`) is in the engine path set that already
      # gates this job. No coverage - it asserts that emitted strings run in a
      # real AudioWorklet and a real Worker, not that engine lines execute.
      - name: Browser tests (inline worklet/worker sources, headless Chromium)
        run: pnpm test:browser:build

      # The asset cache's persistent store rides along for the same reasons:
      # the same headless Chromium, seconds to run, and a subject in the engine
      # path set that already gates this job. No coverage - it asserts that a
      # real IndexedDB commits, clones and ranges the way the store assumes,
      # not that engine lines execute.
      - name: Browser tests (IndexedDB cache store, headless Chromium)
        run: pnpm test:browser:assets

      - name: Upload coverage to Codecov (browser flag)
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v6.0.2
        with:
          files: ./coverage/lcov.info
          flags: browser
          # Non-fatal without a token (Dependabot / fork PRs) — see the unit
          # coverage upload above for the rationale.
          fail_ci_if_error: ${{ secrets.CODECOV_TOKEN != '' }}
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          files: ./test-results/browser-webgl.junit.xml
          flags: browser-webgl
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      # See the unit-tests job's matching step: fed into the `skip-budget` job.
      - name: Upload JUnit report for the skip-budget gate
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-browser-webgl
          path: ./test-results/browser-webgl.junit.xml
          retention-days: 1
          if-no-files-found: warn

  # Blocking lane. Chromium WebGPU is run against Mesa lavapipe (a real Vulkan
  # software rasterizer) instead of Chromium's bundled SwiftShader WebGPU
  # fallback — the three.js-proven recipe for getting actual GPU-path coverage
  # out of a free `ubuntu-latest` runner (no Docker / self-hosted runner
  # needed). `mesa-vulkan-drivers` provides the lavapipe ICD, `VK_DRIVER_FILES`
  # points Chromium's ANGLE Vulkan backend at it, and the launch args in
  # `vitest.config.ts` (`--enable-features=Vulkan`, `--disable-vulkan-surface`)
  # are required for Chromium to actually pick up a Vulkan adapter instead of
  # silently falling back to SwiftShader. lavapipe additionally needs a real
  # display surface to report a usable adapter, so this job sets
  # `EXOJS_WEBGPU_CI_HEADED=1` (opts the `browser-webgpu` vitest project into
  # `headless: false`) and runs under `xvfb-run` to supply that display — CI
  # only; the project stays headless by default so a plain local
  # `pnpm test:browser:webgpu` never pops a visible browser window. Previously
  # this lane self-skipped almost everything via `getBackendDeviceOrSkip()`
  # under SwiftShader and was `continue-on-error`, so it reported green
  # without proving anything; it is now a real, blocking WebGPU lane.
  browser-tests-webgpu-chromium:
    name: Browser Tests (Chromium WebGPU)
    needs: [changes]
    if: ${{ needs.changes.outputs.engine == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
      # Opts the `browser-webgpu` vitest project into `headless: false` (see
      # vitest.config.ts). Unset locally, so `pnpm test:browser:webgpu` stays
      # headless by default and never pops a visible browser window on a dev box.
      EXOJS_WEBGPU_CI_HEADED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install Mesa lavapipe + xvfb
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers xvfb

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ inputs.pnpm-version }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          check-latest: true
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm bootstrap

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # No `--` before the args (see the unit-tests step note).
      - name: Browser tests (Chromium WebGPU, Mesa lavapipe via xvfb)
        run: xvfb-run -a pnpm test:browser:webgpu --reporter=default --reporter=junit --outputFile.junit=./test-results/browser-webgpu.junit.xml

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          files: ./test-results/browser-webgpu.junit.xml
          flags: browser-webgpu
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      # See the unit-tests job's matching step: fed into the `skip-budget` job.
      # This is the lane where the runtime `ctx.skip('WebGPU device lost
      # mid-test — …')` calls actually fire — Mesa lavapipe's software adapter
      # loses the device under load in a way a real GPU adapter does not — so
      # this artifact is the one that makes them visible to the budget at all.
      - name: Upload JUnit report for the skip-budget gate
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-browser-webgpu
          path: ./test-results/browser-webgpu.junit.xml
          retention-days: 1
          if-no-files-found: warn

  # The WebGL2 half of this lane is a required gate: running headed under xvfb
  # gives Firefox a real WebGL2 context, and it has been at 262/262 since. It is
  # the only lane covering a second engine, so a regression there should block.
  #
  # The WebGPU half stays non-blocking at the step level. Firefox exposes a
  # WebGPU adapter only in a genuinely headed session — `requestAdapter()`
  # returns null under xvfb regardless of `dom.webgpu.enabled` /
  # `gfx.webgpu.force-enabled` — so those rows come from local runs via
  # `pnpm test:browser:webgpu:firefox`.
  browser-tests-firefox:
    name: Browser Tests (Firefox)
    needs: [changes]
    if: ${{ needs.changes.outputs.engine == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ inputs.pnpm-version }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          check-latest: true
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm bootstrap

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps firefox

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # Firefox disables WebGL outright in headless mode — no preference changes
      # that, it is a browser-level limitation (playwright#1032, #21783, still
      # current). A window is the only configuration where a context exists, so
      # this runs headed against the virtual display xvfb supplies, the same
      # recipe as the Chromium WebGPU lane above. LIBGL_ALWAYS_SOFTWARE points
      # Mesa at llvmpipe so there is something to rasterise on.
      - name: Browser tests (Firefox WebGL2, headed via xvfb)
        env:
          EXOJS_FIREFOX_CI_HEADED: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        # No `--` before the args (see the unit-tests step note).
        run: xvfb-run -a pnpm test:browser:webgl:firefox --reporter=default --reporter=junit --outputFile.junit=./test-results/browser-webgl-firefox.junit.xml

      # See the unit-tests job's matching step: fed into the `skip-budget` job.
      # Only the blocking WebGL2 half — the WebGPU half below is non-blocking
      # and does not run in CI by default (see the job comment above), so
      # folding its skips into the global budget would make a required gate
      # depend on a lane CI does not reliably execute.
      - name: Upload JUnit report for the skip-budget gate
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-browser-webgl-firefox
          path: ./test-results/browser-webgl-firefox.junit.xml
          retention-days: 1
          if-no-files-found: warn

      # Non-blocking on purpose: no WebGPU adapter without a real display (see
      # the job comment). Kept in the lane so the log records what a headless
      # runner actually reports, rather than the absence being invisible.
      - name: Browser tests (Firefox WebGPU, headed)
        continue-on-error: true
        run: pnpm test:browser:webgpu:firefox

  # Renders the audio-fx worklet effects (PitchShift/Vocoder/Granular) through a
  # real OfflineAudioContext + AudioWorklet in headless Chromium — the acoustic
  # contract layer the jsdom mock cannot cover. Path-gated to `audioFx` so it
  # only runs when the audio-fx package (or a shared root) changes; required
  # (blocking) on those PRs because it exercises our own DSP.
  browser-tests-audio:
    name: Browser Tests (Audio)
    needs: [changes]
    if: ${{ needs.changes.outputs.audioFx == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ inputs.pnpm-version }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          check-latest: true
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm bootstrap

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser tests (audio, headless Chromium)
        run: pnpm test:browser:audio --reporter=default --reporter=junit --outputFile.junit=./test-results/browser-audio.junit.xml

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          files: ./test-results/browser-audio.junit.xml
          flags: browser-audio
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      # See the unit-tests job's matching step: fed into the `skip-budget` job.
      # Path-gated like the job itself — absent on a run where this lane did
      # not execute at all, which the aggregator tolerates (see that job).
      - name: Upload JUnit report for the skip-budget gate
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-browser-audio
          path: ./test-results/browser-audio.junit.xml
          retention-days: 1
          if-no-files-found: warn

  # Runs WorkerSampledChunkSource's real-Worker round trip in headless Chromium
  # — jsdom implements neither Worker nor URL.createObjectURL. Path-gated to
  # `tilemapWorker` so it only runs when exojs-tilemap (or a shared root)
  # changes; required (blocking) on those PRs because it exercises our own
  # worker-transport logic.
  browser-tests-tilemap-worker:
    name: Browser Tests (Tilemap Worker)
    needs: [changes]
    if: ${{ needs.changes.outputs.tilemapWorker == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ inputs.pnpm-version }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          check-latest: true
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm bootstrap

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser tests (tilemap worker, headless Chromium)
        run: pnpm test:browser:tilemap --reporter=default --reporter=junit --outputFile.junit=./test-results/browser-tilemap-worker.junit.xml

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          files: ./test-results/browser-tilemap-worker.junit.xml
          flags: browser-tilemap-worker
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      # See the unit-tests job's matching step: fed into the `skip-budget` job.
      # Path-gated like the job itself — absent on a run where this lane did
      # not execute at all, which the aggregator tolerates (see that job).
      - name: Upload JUnit report for the skip-budget gate
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-browser-tilemap-worker
          path: ./test-results/browser-tilemap-worker.junit.xml
          retention-days: 1
          if-no-files-found: warn

  # Aggregates the JUnit report every test lane above just uploaded and runs
  # the skip-budget gate against ALL of them combined — one global budget per
  # suite file, not one per lane (see scripts/check-skipped-tests.ts). This is
  # deliberately its own job, downstream of every lane, rather than a step
  # inside `unit-tests`: a runtime `ctx.skip('WebGPU device lost mid-test — …')`
  # only ever appears in `browser-tests-webgpu-chromium`'s report, so checking
  # from inside the unit lane alone could never see it — exactly the blind spot
  # this gate exists to close.
  #
  # `needs` lists every lane that MAY upload a `junit-*` artifact so this job
  # waits for all of them; `!cancelled()` (rather than the default implicit
  # `success()`) still runs it when a path-gated lane (audio/tilemap-worker)
  # was skipped, since the download step below tolerates a pattern matching
  # zero artifacts. It does NOT run after an outright cancellation.
  skip-budget:
    name: Skip Budget
    needs: [changes, unit-tests, browser-tests, browser-tests-webgpu-chromium, browser-tests-firefox, browser-tests-audio, browser-tests-tilemap-worker]
    if: ${{ !cancelled() && needs.changes.outputs.engine == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ inputs.pnpm-version }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          check-latest: true
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm bootstrap

      # Every lane's `junit-*` artifact, merged into one directory. A
      # path-gated lane that didn't run this time simply contributes nothing:
      # a `pattern` matching fewer artifacts than expected only warns, so a
      # docs-only PR's missing audio/tilemap-worker artifact doesn't fail here.
      # Matching NOTHING at all is still fatal, but one step later and with a
      # better message — the checker refuses to read zero reports as zero skips.
      - name: Download JUnit reports from every lane
        uses: actions/download-artifact@v4
        with:
          pattern: junit-*
          path: test-results
          merge-multiple: true

      - name: Check skipped tests against the budget (all lanes combined)
        run: pnpm test:skips:check

  # Builds the core package and all extension packages exactly once, then
  # publishes the resulting dist trees as a shared artifact. `package-verify`
  # and `site-build` both consume this artifact instead of each rebuilding the
  # library themselves — this collapses what used to be a serial
  # `lint -> package-verify (builds) -> site-build (rebuilds)` critical path
  # into a single build that the two downstream jobs can consume in parallel.
  build:
    name: Build
    needs: [changes]
    # Gated on engine OR site (not just engine): a site-only change still
    # needs the library built, because `site:build`'s vendor:sync reads from
    # the built dist/ tree. `needs: [changes]` only (not typecheck/lint) so
    # this build runs in parallel with those gates rather than after them — a
    # wasted build on a rare lint/typecheck failure is an acceptable trade for
    # the parallelism, since required-ci fails on typecheck/lint regardless.
    if: ${{ needs.changes.outputs.engine == 'true' || needs.changes.outputs.site == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ inputs.pnpm-version }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          check-latest: true
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm bootstrap

      - name: Build core
        env:
          # Enables the Codecov bundle-analysis upload in scripts/build.ts;
          # absent (e.g. fork PRs, local builds) the build stays offline.
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          # Also build + track the all-in-one bundle (core + every extension)
          # so Codecov's Bundles tab carries the "everything together" number.
          EXOJS_FULL_BUNDLE: '1'
        run: pnpm build

      # The extension packages each have their own Rolldown build; pnpm runs
      # them in workspace-dependency order (tilemap before tiled).
      - name: Build extension packages
        env:
          # Per-package bundle-analysis uploads (see exojs-config/rolldown).
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: pnpm --filter "@codexo/exojs-particles" --filter "@codexo/exojs-tilemap" --filter "@codexo/exojs-tiled" --filter "@codexo/exojs-physics" --filter "@codexo/exojs-tilemap-physics" --filter "@codexo/exojs-audio-fx" --filter "@codexo/exojs-aseprite" --filter "@codexo/exojs-ldtk" --filter "@codexo/exojs-react" build

      # The dist-dependent half of production-stripping.test.ts asserts that the
      # artefacts we actually ship carry no unresolved __DEV__/__VERSION__/
      # __REVISION__ and that buildInfo matches the manifest. The unit lane never
      # builds, so those checks self-skipped on every run; this is the only lane
      # where `dist/` exists. EXOJS_REQUIRE_PRODUCTION_BUILD turns a missing
      # build into a failure so the step cannot go quiet again.
      - name: Verify production stripping against the built dist
        env:
          EXOJS_REQUIRE_PRODUCTION_BUILD: '1'
        run: pnpm test:production-stripping

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/
            packages/*/dist/
          retention-days: 1
          if-no-files-found: error

  package-verify:
    name: Package Build + Verify
    needs: [changes, build]
    if: ${{ needs.changes.outputs.engine == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ inputs.pnpm-version }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          check-latest: true
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm bootstrap

      # Restores dist/ + packages/*/dist/ (built once by the `build` job)
      # instead of rebuilding here.
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist

      - name: Check bundle sizes
        run: pnpm size

      # Reports, never judges: the step above is the gate. `always()` so a
      # breached budget still says by how much instead of only that it failed.
      - name: Report bundle budgets
        if: always()
        run: pnpm size:summary

      - name: Verify core package exports
        run: pnpm verify:exports

      # A published .d.ts may only import what a consumer can resolve. Catches
      # the shader/worklet specifiers here rather than in the release job's
      # external-consumer smoke, which is the only other place that reads the
      # emitted declarations the way a consumer does.
      - name: Verify declaration imports
        run: pnpm verify:declaration-imports

      # Lockstep versions + peer-range coherence + deterministic publish-order
      # matrix across all four published packages (the same gates release.yml
      # runs before a publish).
      - name: Verify lockstep versions and peer ranges
        run: pnpm verify:lockstep

      - name: Verify release publish matrix
        run: pnpm verify:release-matrix

      - name: Core package dry run
        run: pnpm pack --dry-run

      # Pack each extension package (dry run) so a broken `files`/`exports` set in
      # a package manifest is caught here, not at release time.
      # `@codexo/exojs-build` is published too, but on its own tooling version
      # line rather than the engine lockstep, so it is packed here and left out
      # of the lockstep/publish-order matrix above.
      - name: Extension package dry runs
        run: pnpm --filter "@codexo/exojs-build" --filter "@codexo/exojs-particles" --filter "@codexo/exojs-tilemap" --filter "@codexo/exojs-tiled" --filter "@codexo/exojs-physics" --filter "@codexo/exojs-tilemap-physics" --filter "@codexo/exojs-audio-fx" --filter "@codexo/exojs-aseprite" --filter "@codexo/exojs-ldtk" --filter "@codexo/exojs-react" pack --dry-run

      # publint validates the published package.json itself (exports map, files,
      # types resolution, module/main coherence) — the layer attw does NOT cover
      # (attw checks .d.ts resolution; publint checks the manifest contract).
      # Pinned + via dlx (no permanent dependency), matching the attw pattern.
      # Runs against the built dist of each package (core + extensions built above).
      - name: Validate published package manifests (publint)
        run: pnpm verify:publint

  release-dry-run:
    name: Release dry run
    # PR-only shift-left of the build-once release `prepare` (pack -> attw ->
    # external consumers). Every tooling bug that broke the v0.13.0 release —
    # tilemap missing from the pack set, attw output-format drift — would have
    # failed HERE on a cheap PR instead of mid-flight on an irreversible tag.
    # `--skip-zip` avoids the site build + 220 MB archive. It does NOT run the
    # real publish (provenance / dist-tag need real OIDC), so the
    # repository-field/provenance prerequisite is covered by verify:release-matrix
    # instead. The tag/release context skips this — release.yml runs the real
    # prepare there. Path-filtered to release-relevant changes so most PRs skip it.
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Filter release-relevant changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            release:
              - 'scripts/release/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'packages/*/package.json'
              - '.github/workflows/release.yml'

      - name: Setup pnpm
        if: steps.filter.outputs.release == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: ${{ inputs.pnpm-version }}
          run_install: false

      - name: Setup Node
        if: steps.filter.outputs.release == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          check-latest: true
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        if: steps.filter.outputs.release == 'true'
        run: pnpm bootstrap

      - name: Release prepare (build-once, no publish, no full-zip)
        if: steps.filter.outputs.release == 'true'
        run: pnpm release:prepare --build --skip-zip

  site-build:
    name: Site build
    # Runs whenever site/examples/packages changed. Depends only on `build`
    # (not `package-verify`) so it runs in parallel with package-verify
    # instead of serially after it; it still won't waste a site build if the
    # shared build failed.
    needs: [changes, build]
    if: ${{ !cancelled() && needs.changes.outputs.site == 'true' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ inputs.pnpm-version }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          check-latest: true
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # Root install is required because the site consumes the local
      # workspace package and vendor:sync reads from the built dist/ tree.
      - name: Install root dependencies
        run: pnpm bootstrap

      # Restores dist/ + packages/*/dist/ (built once by the `build` job)
      # instead of rebuilding here.
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist

      # `astro check` + `tsc --noEmit` over the site sources. This is the one
      # verify:quick gate that cannot run in the ungated typecheck job: the site
      # consumes @codexo/exojs as a workspace package whose `types` resolve to
      # dist/esm/index.d.ts, which only exists after the `build` job. Runs before
      # the build so a type error reports as a typecheck failure, not a build one.
      - name: Site typecheck gate
        run: pnpm gates site

      # Site build = vendor:sync + examples:sync + astro build.
      - name: Build site
        env:
          EXOJS_PACKAGE_PATH: ..
          # Enables the Codecov bundle-analysis upload in astro.config.ts.
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: pnpm site:build

      # The bytes that just passed `gates site` + `site:build` ARE the bytes
      # GitHub Pages serves: deploy-pages.yml downloads this artifact from this
      # run and deploys it verbatim, instead of checking the sources out and
      # producing a second, ungated build of its own. The commit in the name
      # binds the artifact to a single commit on both sides of the handover, so
      # a mismatched pair fails to resolve rather than deploying silently.
      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist-${{ github.sha }}
          path: site/dist/
          retention-days: 1
          if-no-files-found: error

  # Boots every entry in the example catalog in headless Chromium. Nothing else
  # in CI executes an example: `typecheck:examples` compiles the sources,
  # `examples:sync:check` compares the generated `.js` twins against them, and
  # the site build only has to render the pages that link them - an example
  # whose scene throws on start passes all three and still ships a black canvas.
  #
  # Consumes the `site-build` job's artifact rather than building the site a
  # second time: `smoke-examples.ts` serves `site/dist` over a throwaway static
  # server, so the bytes it smokes are the bytes that job validated.
  example-smoke:
    name: Example Smoke
    needs: [changes, site-build]
    if: ${{ !cancelled() && needs.changes.outputs.exampleCatalog == 'true' && needs['site-build'].result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ inputs.pnpm-version }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          check-latest: true
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm bootstrap

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site-dist-${{ github.sha }}
          path: site/dist

      - name: Smoke the example catalog
        run: pnpm test:examples:smoke

      # The harness writes a per-example table; keep it when the lane is red so
      # the failing entry is readable without re-running anything.
      - name: Upload the smoke report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: example-smoke-report
          path: .workspace/reports/example-smoke.md
          retention-days: 7
          if-no-files-found: ignore

  required-ci:
    name: Required CI
    if: ${{ always() }}
    needs:
      [
        changes,
        typecheck,
        lint,
        sync-checks,
        package-policy,
        unit-tests,
        browser-tests,
        browser-tests-webgpu-chromium,
        browser-tests-firefox,
        browser-tests-audio,
        browser-tests-tilemap-worker,
        skip-budget,
        build,
        package-verify,
        site-build,
        example-smoke,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate required job results
        env:
          ENGINE: ${{ needs.changes.outputs.engine }}
          SITE: ${{ needs.changes.outputs.site }}
          AUDIOFX: ${{ needs.changes.outputs.audioFx }}
          TILEMAPWORKER: ${{ needs.changes.outputs.tilemapWorker }}
          EXAMPLECATALOG: ${{ needs.changes.outputs.exampleCatalog }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          SYNC_CHECKS_RESULT: ${{ needs['sync-checks'].result }}
          PACKAGE_POLICY_RESULT: ${{ needs['package-policy'].result }}
          UNIT_TESTS_RESULT: ${{ needs['unit-tests'].result }}
          BROWSER_TESTS_RESULT: ${{ needs['browser-tests'].result }}
          BROWSER_WEBGPU_RESULT: ${{ needs['browser-tests-webgpu-chromium'].result }}
          BROWSER_FIREFOX_RESULT: ${{ needs['browser-tests-firefox'].result }}
          BROWSER_AUDIO_RESULT: ${{ needs['browser-tests-audio'].result }}
          BROWSER_TILEMAP_WORKER_RESULT: ${{ needs['browser-tests-tilemap-worker'].result }}
          SKIP_BUDGET_RESULT: ${{ needs['skip-budget'].result }}
          BUILD_RESULT: ${{ needs.build.result }}
          PACKAGE_VERIFY_RESULT: ${{ needs['package-verify'].result }}
          SITE_BUILD_RESULT: ${{ needs['site-build'].result }}
          EXAMPLE_SMOKE_RESULT: ${{ needs['example-smoke'].result }}
        run: |
          echo "areas: engine=$ENGINE site=$SITE audioFx=$AUDIOFX tilemapWorker=$TILEMAPWORKER exampleCatalog=$EXAMPLECATALOG"
          echo "changes: $CHANGES_RESULT"
          echo "typecheck: $TYPECHECK_RESULT"
          echo "lint: $LINT_RESULT"
          echo "sync-checks: $SYNC_CHECKS_RESULT"
          echo "package-policy: $PACKAGE_POLICY_RESULT"
          echo "unit-tests: $UNIT_TESTS_RESULT"
          echo "browser-tests: $BROWSER_TESTS_RESULT"
          echo "browser-tests-webgpu-chromium: $BROWSER_WEBGPU_RESULT"
          echo "browser-tests-firefox: $BROWSER_FIREFOX_RESULT"
          echo "browser-tests-audio: $BROWSER_AUDIO_RESULT"
          echo "browser-tests-tilemap-worker: $BROWSER_TILEMAP_WORKER_RESULT"
          echo "skip-budget: $SKIP_BUDGET_RESULT"
          echo "build: $BUILD_RESULT"
          echo "package-verify: $PACKAGE_VERIFY_RESULT"
          echo "site-build: $SITE_BUILD_RESULT"
          echo "example-smoke: $EXAMPLE_SMOKE_RESULT"

          failed=0

          # The change detector must run — a skipped detector would silently
          # false-green every downstream lane.
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::Detect changes did not succeed (result: $CHANGES_RESULT)."
            failed=1
          fi

          # A real "failure" or "cancelled" in any required lane fails the gate.
          # "skipped" is tolerated HERE because path filtering can legitimately
          # skip a whole area (a docs-only PR skips the engine lanes; an
          # engine-only PR skips the site build). Wrongly-skipped IMPACTED lanes
          # are caught by the contract checks below.
          for entry in \
            "typecheck=$TYPECHECK_RESULT" \
            "lint=$LINT_RESULT" \
            "sync-checks=$SYNC_CHECKS_RESULT" \
            "package-policy=$PACKAGE_POLICY_RESULT" \
            "unit-tests=$UNIT_TESTS_RESULT" \
            "browser-tests=$BROWSER_TESTS_RESULT" \
            "browser-tests-webgpu-chromium=$BROWSER_WEBGPU_RESULT" \
            "browser-tests-firefox=$BROWSER_FIREFOX_RESULT" \
            "browser-tests-audio=$BROWSER_AUDIO_RESULT" \
            "browser-tests-tilemap-worker=$BROWSER_TILEMAP_WORKER_RESULT" \
            "skip-budget=$SKIP_BUDGET_RESULT" \
            "build=$BUILD_RESULT" \
            "package-verify=$PACKAGE_VERIFY_RESULT" \
            "site-build=$SITE_BUILD_RESULT" \
            "example-smoke=$EXAMPLE_SMOKE_RESULT"; do
            name="${entry%%=*}"
            result="${entry#*=}"
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error::Required job '$name' $result."
              failed=1
            fi
          done

          # Contract enforcement (the core of this fix): when the detector
          # classifies a change as engine-impacting, the engine lanes MUST have
          # run. A "skipped" here means the path filter wrongly excluded an
          # impacted change — exactly the defect that let package-only PRs go
          # green while their unit / package / browser lanes were skipped.
          # `browser-tests-webgpu-chromium` shares the same `engine` gate as
          # `browser-tests` / `unit-tests` / `package-verify` (see its `if:`
          # above), so it belongs in this same contract check rather than a
          # bespoke one like `browser-tests-audio`'s (audio-fx has its own,
          # narrower path-filter flag).
          if [ "$ENGINE" = "true" ]; then
            for entry in \
              "unit-tests=$UNIT_TESTS_RESULT" \
              "browser-tests=$BROWSER_TESTS_RESULT" \
              "browser-tests-webgpu-chromium=$BROWSER_WEBGPU_RESULT" \
              "browser-tests-firefox=$BROWSER_FIREFOX_RESULT" \
              "skip-budget=$SKIP_BUDGET_RESULT" \
              "build=$BUILD_RESULT" \
              "package-verify=$PACKAGE_VERIFY_RESULT"; do
              name="${entry%%=*}"
              result="${entry#*=}"
              if [ "$result" = "skipped" ]; then
                echo "::error::Engine change detected but required lane '$name' was skipped (path-filter regression)."
                failed=1
              fi
            done
          fi

          # An audio-fx change must run the browser-audio lane.
          if [ "$AUDIOFX" = "true" ] && [ "$BROWSER_AUDIO_RESULT" = "skipped" ]; then
            echo "::error::Audio-fx change detected but 'browser-tests-audio' was skipped (path-filter regression)."
            failed=1
          fi

          # A tilemap-worker change must run the browser-tilemap-worker lane.
          if [ "$TILEMAPWORKER" = "true" ] && [ "$BROWSER_TILEMAP_WORKER_RESULT" = "skipped" ]; then
            echo "::error::Tilemap-worker change detected but 'browser-tests-tilemap-worker' was skipped (path-filter regression)."
            failed=1
          fi

          # Likewise a site-impacting change must build the site — unless the
          # package build failed first, in which case site-build is intentionally
          # skipped and the package-verify failure is already counted above.
          if [ "$SITE" = "true" ] && [ "$PACKAGE_VERIFY_RESULT" != "failure" ]; then
            if [ "$SITE_BUILD_RESULT" = "skipped" ]; then
              echo "::error::Site change detected but 'site-build' was skipped (path-filter regression)."
              failed=1
            fi
          fi

          # An example-catalog change must smoke the catalog - unless the site
          # build it consumes failed first, in which case example-smoke is
          # intentionally skipped and the site-build failure is already counted.
          if [ "$EXAMPLECATALOG" = "true" ] && [ "$SITE_BUILD_RESULT" != "failure" ] && [ "$BUILD_RESULT" != "failure" ]; then
            if [ "$EXAMPLE_SMOKE_RESULT" = "skipped" ]; then
              echo "::error::Example-catalog change detected but 'example-smoke' was skipped (path-filter regression)."
              failed=1
            fi
          fi

          if [ "$failed" -ne 0 ]; then
            echo "::error::At least one required CI check failed, was cancelled, or was wrongly skipped."
            exit 1
          fi
          echo "All required CI checks satisfied."
