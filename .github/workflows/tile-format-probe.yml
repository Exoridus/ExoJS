# Temporary read-only diagnostic; removed after capturing the formatter diff.
name: Tilemap formatter probe
on:
  push:
    branches: [perf/tile-multitexture-batches]
permissions:
  contents: read
jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Print formatter-only patch
        shell: bash
        run: |
          pnpm exec oxfmt --write packages/exojs-tilemap/src/webgpu/WebGpuTileChunkRenderer.ts
          git --no-pager diff -- packages/exojs-tilemap/src/webgpu/WebGpuTileChunkRenderer.ts
