name: A2 loader evidence

on:
  push:
    branches: [fix/a2-loader-option-diagnostics]

permissions:
  contents: write

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .worktrees/a2-loader
    steps:
      - uses: actions/checkout@v6
        with:
          path: source
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Create isolated linked worktree
        working-directory: source
        run: |
          git worktree add ../.worktrees/a2-loader -b fix/a2-loader-option-diagnostics "${GITHUB_SHA}"
          git worktree list --porcelain
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: source/package.json
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: source/.nvmrc
          check-latest: true
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - run: pnpm bootstrap
      - name: Update the diagnostic text assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('test/assets/loader-seamless.test.ts')
          s = p.read_text()
          old = "expect(warnings[0]).toContain('the options this get() asked for were ignored');"
          new = "expect(warnings[0]).toContain('conflicting options were ignored for the shared payload');"
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))
          PY
          git diff --check
          pnpm exec eslint test/assets/loader-seamless.test.ts
          pnpm exec prettier --check test/assets/loader-seamless.test.ts
      - name: All asset regressions
        run: pnpm exec vitest run --project=exojs test/assets --reporter=minimal
      - name: Upload verified candidate blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          path = 'test/assets/loader-seamless.test.ts'
          data = json.dumps({'content': Path(path).read_text(), 'encoding': 'utf-8'})
          out = subprocess.check_output(['gh', 'api', '--method', 'POST', 'repos/Exoridus/ExoJS/git/blobs', '--input', '-'], input=data.encode())
          print('CANDIDATE_BLOB ' + path + ' ' + json.loads(out)['sha'], flush=True)
          PY
