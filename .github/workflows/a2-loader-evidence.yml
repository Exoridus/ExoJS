name: A2 loader evidence

on:
  push:
    branches: [fix/a2-loader-option-diagnostics]

permissions:
  contents: write

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: source/.worktrees/a2-loader
    steps:
      - uses: actions/checkout@v6
        with:
          path: source
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Create linked worktree
        working-directory: source
        run: |
          git check-ignore .worktrees/probe
          git worktree add .worktrees/a2-loader -b fix/a2-loader-option-diagnostics "${GITHUB_SHA}"
          git worktree list --porcelain
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: source/package.json
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: source/.nvmrc
          check-latest: true
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - run: pnpm bootstrap
      - name: Apply bounded diagnostics correction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/assets/AssetResidency.ts')
          s = p.read_text()
          old = '    this._requestLog.record(asset);\n\n    return entry;'
          assert s.count(old) == 1
          s = s.replace(old, '    if (__DEV__) {\n      this._warnIgnoredOptions(asset, this._optionsFor(asset.key, asset.options), asset.options);\n    }\n\n' + old)
          for old, count in [('      this._warnIgnoredOptions(asset, entry?.options, options);\n\n', 1), ('        this._warnIgnoredOptions(asset, entry.options, options);\n\n', 2)]:
              assert s.count(old) == count, (old, s.count(old))
              s = s.replace(old, '')
          start = s.index('  /**\n   * Dev-only diagnostic for the first-wins options contract:')
          end = s.index('  private _warnIgnoredOptions', start)
          s = s[:start] + '  /** Diagnose conflicting shared acquisition options once per canonical key, independently of the acquiring call shape. */\n' + s[end:]
          old = '''      `Asset "${asset.source}" is already loaded or loading, so the options this get() asked for were ignored - ` +
                  `the first call's options win, and an instance keeps the options it was created with. ` +
                  `Pass the options on the first acquisition, or use an Assets catalog leaf / Asset.type(...) for an independent instance.`,'''
          # Match the existing formatting exactly without depending on Python block indentation.
          start = s.index('      `Asset "${asset.source}" is already loaded or loading, so the options this get()')
          end = s.index("      { source: 'Loader', once:", start)
          s = s[:start] + '''      `Asset "${asset.source}" already has a canonical acquisition, so conflicting options were ignored for the shared payload. ` +
                  `The first acquisition's options win. Pass shared acquisition options on that first call; ` +
                  `a catalog or descriptor leaf may retain its own local settings but does not create an independent acquisition.`,
          '''.replace('                  `', '        `').replace('\n          ', '\n') + s[end:]
          p.write_text(s)
          PY
          pnpm exec eslint src/assets/AssetResidency.ts test/assets/loader-option-diagnostics.test.ts --fix
          pnpm exec prettier --write src/assets/AssetResidency.ts test/assets/loader-option-diagnostics.test.ts
          git diff --check
          git diff --stat
          git diff -- src/assets/AssetResidency.ts
      - name: Loader diagnostics GREEN and residency regressions
        run: pnpm exec vitest run --project=exojs test/assets/loader-option-diagnostics.test.ts test/assets/asset-residency.test.ts test/assets/asset-access-integration.test.ts test/assets/asset-descriptor-contracts.test.ts
      - name: Upload candidate Git blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          for path in ['src/assets/AssetResidency.ts', 'test/assets/loader-option-diagnostics.test.ts']:
              data = json.dumps({'content': Path(path).read_text(), 'encoding': 'utf-8'})
              out = subprocess.check_output(['gh', 'api', '--method', 'POST', 'repos/Exoridus/ExoJS/git/blobs', '--input', '-'], input=data.encode())
              print('CANDIDATE_BLOB ' + path + ' ' + json.loads(out)['sha'], flush=True)
          PY
      - name: Typecheck
        run: pnpm gates typecheck
      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm gates lint
      - name: Sync
        if: ${{ !cancelled() }}
        run: pnpm gates sync
      - name: Production logging stripping
        if: ${{ !cancelled() }}
        run: |
          pnpm build
          node --input-type=module -e "import {readFileSync} from 'node:fs'; import assert from 'node:assert/strict'; const s=readFileSync('dist/exo.esm.js','utf8'); assert(!s.includes('loader:ignored-options:')); console.log('Production ignored-option diagnostic stripped');"
