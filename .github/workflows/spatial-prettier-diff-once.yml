# Temporary diagnostic only; remove after retrieving the exact format patch.
name: Spatial benchmark Prettier patch
on:
  push:
    branches:
      - fix/u1-spatial-index-perf
    paths:
      - .github/workflows/spatial-prettier-diff-once.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Print exact Prettier formatting diff
        shell: bash
        run: |
          pnpm exec prettier --write test/perf/interaction-spatial-index-measure.ts
          git diff --no-ext-diff -- test/perf/interaction-spatial-index-measure.ts
