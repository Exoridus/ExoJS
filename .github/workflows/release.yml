name: Release

# Tag -> trust -> prepare -> publish.
#
# The tagged commit is not re-verified here: `trust` requires it to sit on
# `main` with a green `verdict` from the CI workflow, which ran every lane on
# the push that brought it there. Tagging a commit CI never validated is a
# hard failure, not a slower path.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (must already exist, e.g. v0.16.2)'
        required: true

permissions:
  contents: write
  # npm mints its provenance token from GitHub OIDC at publish time.
  id-token: write
  # `trust` reads the tagged commit's check runs.
  checks: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # The dispatch input wins over the pushed ref so an explicit tag is always
  # the one released.
  TARGET_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  trust:
    name: Trust the green CI run at the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_TAG }}

      # No install: the trust check is dependency-free TypeScript that node
      # strips - the same script the pre-push hook runs before a tag leaves
      # the developer's machine.
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'

      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "sha=$(git rev-parse "${TARGET_TAG}^{commit}")" >> "$GITHUB_OUTPUT"
          node scripts/ci/trust.ts "$TARGET_TAG"

  # Build every lockstep package exactly once, then pack/hash/attw/consumers/
  # full-zip without rebuilding, and upload the result. Any failure here means
  # nothing is published.
  prepare:
    name: Prepare release artifacts
    needs: trust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_TAG }}
      - uses: ./.github/actions/setup

      - name: Verify release package matrix
        run: |
          pnpm verify:lockstep
          pnpm verify:release-matrix

      - name: Build core, extensions and the site
        env:
          EXOJS_PACKAGE_PATH: ..
        # One line per package: verify:release-matrix checks each against the
        # lockstep list, so a package added without a build line fails there.
        run: |
          pnpm build
          pnpm --filter @codexo/exojs-particles build
          pnpm --filter @codexo/exojs-tilemap build
          pnpm --filter @codexo/exojs-tiled build
          pnpm --filter @codexo/exojs-physics build
          pnpm --filter @codexo/exojs-tilemap-physics build
          pnpm --filter @codexo/exojs-audio-fx build
          pnpm --filter @codexo/exojs-aseprite build
          pnpm --filter @codexo/exojs-ldtk build
          pnpm --filter @codexo/exojs-react build
          pnpm site:build

      # Deploy Pages ships the site of a successful release from this artifact.
      - uses: actions/upload-artifact@v4
        with:
          name: site-dist-${{ needs.trust.outputs.sha }}
          path: site/dist/
          retention-days: 1
          if-no-files-found: error

      # The site build regenerates tracked content with platform-dependent
      # output, and the release freeze refuses a dirty tree. The tag is the
      # source of truth and everything packed comes from untracked dist/, so
      # the drift is logged and reset.
      - name: Reset tracked build side-effects
        run: |
          git status --porcelain
          git checkout -- .

      - name: Prepare release (pack, hash, attw, consumers, full-zip)
        run: pnpm release:prepare

      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            .release/artifacts/
            .release/exojs-${{ env.TARGET_TAG }}-full.zip
            .release/exojs-${{ env.TARGET_TAG }}-full.zip.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm and GitHub
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_TAG }}
      - uses: ./.github/actions/setup
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: .release

      - name: Publish coordinated release (build-once, dist-tag -> latest)
        run: pnpm release:publish --execute

      - name: Generate release notes
        run: |
          pnpm release:notes -- \
            --tag "${TARGET_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --out ".release/release-notes.md"

      - name: Create GitHub release with Full ZIP
        uses: softprops/action-gh-release@v3
        with:
          body_path: .release/release-notes.md
          tag_name: ${{ env.TARGET_TAG }}
          files: |
            .release/exojs-${{ env.TARGET_TAG }}-full.zip
            .release/exojs-${{ env.TARGET_TAG }}-full.zip.sha256
            .release/artifacts/checksums.sha256
            .release/artifacts/release-manifest.json
