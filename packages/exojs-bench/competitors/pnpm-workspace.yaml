# Standalone install root for the benchmark competitor libraries. Keeping a
# workspace file here makes pnpm stop its upward lookup at this directory, so
# the install never joins the repository workspace - and it applies the same
# supply-chain quarantine the root workspace enforces, which an
# --ignore-workspace install would silently skip.
packages:
  - .

minimumReleaseAge: 4320

# pnpm 11 may incorrectly skip materializing a locked standalone install.
# This workspace is opt-in; validate its dependencies on every explicit setup.
optimisticRepeatInstall: false
