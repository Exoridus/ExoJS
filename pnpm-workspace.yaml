packages:
  - site
  - packages/exojs-build
  - packages/exojs-config
  - packages/exojs-bench
  - packages/exojs-particles
  - packages/exojs-tilemap
  - packages/exojs-tiled
  - packages/exojs-aseprite
  - packages/exojs-ldtk
  - packages/exojs-physics
  - packages/exojs-react
  - packages/exojs-audio-fx
  - packages/exojs-tilemap-physics
  - packages/exojs-lighting
  - packages/exojs-pathfinding
  - packages/exojs-cli
  - packages/create-exo-app
  - packages/eslint-plugin-exojs

# Packages permitted to run install/build scripts. pnpm v10+ blocks build
# scripts by default and prompts for approval; this is the explicit allowlist.
# CI installs with --ignore-scripts and is unaffected by this.
allowBuilds:
  '@parcel/watcher': true
  # Pulled in by @vitest/browser-webdriverio, which drives Safari through the
  # system's own safaridriver and, in the opt-in stock-Firefox WebGPU project, a
  # Firefox and geckodriver the developer supplies. Their postinstall steps
  # download Edge and Firefox drivers we never launch, so they stay off.
  edgedriver: false
  esbuild: true
  geckodriver: false
  sharp: true

# Supply-chain defense: refuse to install any package version younger than this
# (minutes → 3 days). The real npm compromises of recent memory published a
# malicious version and yanked it within hours; this quarantines brand-new
# versions on every install — local AND CI — complementing the Dependabot
# cooldown (which only governs Dependabot's own PRs, not manual installs).
# `--frozen-lockfile` installs of already-pinned versions are unaffected.
minimumReleaseAge: 4320

# Vitest's jsdom Blob shim (5.0.2) finds the implementation object through the
# wrapper's own symbol properties, which jsdom 30 no longer exposes there:
# `URL.createObjectURL(new Blob([...]))` throws "Cannot read properties of undefined
# (reading '_bytes')". Reproduced with vitest 5.0.2 and jsdom 30.1.1, the newest of both.
# Without this pin a workspace package that does not depend on jsdom itself gets
# jsdom 30 through the optional peer and a second Vitest instance with it.
overrides:
  jsdom: ^29.1.1
